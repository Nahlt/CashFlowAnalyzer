# Crea una release su GitHub quando si pubblica un tag di versione, per esempio v0.14.0 (anche V0.14.0).
# Controlla che il tag corrisponda a spese/__init__.py, esegue i test su Linux e Windows (test.yml) e allega
# il pacchetto (.zip e .tar.gz, uguale per Linux e Windows) con le note prese da CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*", "V*"]

permissions:
  contents: write

jobs:
  versione:
    runs-on: ubuntu-24.04
    outputs:
      v: ${{ steps.v.outputs.v }}
    steps:
      - uses: actions/checkout@v5
      - name: Versione del tag e dell'app
        id: v
        run: |
          V="${GITHUB_REF_NAME#[vV]}"
          APP=$(python3 -c 'import re; print(re.search(r"VERSIONE = \"(.+?)\"", open("spese/__init__.py").read()).group(1))')
          if [ "$V" != "$APP" ]; then
            echo "::error::Il tag $GITHUB_REF_NAME non corrisponde alla versione dell'app ($APP)"
            exit 1
          fi
          echo "v=$V" >> "$GITHUB_OUTPUT"

  test:
    needs: versione
    uses: ./.github/workflows/test.yml

  release:
    needs: [versione, test]
    runs-on: ubuntu-24.04
    env:
      V: ${{ needs.versione.outputs.v }}
    steps:
      - uses: actions/checkout@v5

      - name: Pacchetto e note
        run: |
          mkdir dist
          git archive --format=zip    --prefix="CashFlowAnalyzer-$V/" -o "dist/CashFlowAnalyzer-$V.zip"    HEAD
          git archive --format=tar.gz --prefix="CashFlowAnalyzer-$V/" -o "dist/CashFlowAnalyzer-$V.tar.gz" HEAD
          (cd dist && sha256sum * > SHA256SUMS.txt)
          awk -v v="## $V " 'index($0, v) == 1 {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > note.md
          [ -s note.md ] || echo "Vedi CHANGELOG.md" > note.md

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # release creata dalla pagina di GitHub: allega i pacchetti e, se la descrizione e' vuota, mette
            # titolo e note del CHANGELOG
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            if [ -z "$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)" ]; then
              gh release edit "$GITHUB_REF_NAME" --title "CashFlow Analyzer $V" --notes-file note.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "CashFlow Analyzer $V" --notes-file note.md
          fi
