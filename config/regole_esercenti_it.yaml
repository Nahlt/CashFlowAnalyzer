# Regole statiche sugli esercenti (passo deterministico, prima di MCC e marchi NSI).
# Si applicano al nome esercente gia' estratto e ripulito, senza distinzione di maiuscole.
# Vince la regola con il pattern piu' lungo che corrisponde (es. "amazon prime" batte "amazon").
# Un importo positivo sullo stesso esercente e' un rimborso della stessa categoria.
# Formato: pattern (regex Python), l2 (sottocategoria della tassonomia), forza, nota facoltativa.
# forza: alta (default) = marchio preciso, vince anche sul codice MCC;
#        bassa = parola generica (bar, ristorante, hotel...), cede al codice MCC se presente.
# Ordine della catena: regole utente > regole forza alta > MCC decisivo > regole forza bassa > marchi NSI.
versione: 1

regole:
  # --- Alimentari
  - {pattern: '(supermerc|supermer\b|minimarket|discount alimentare)', l2: Supermercato, forza: bassa}
  - {pattern: '\b(esselunga|carrefour|crf (exp|mkt|iper)|lidl|conad|\bcoop\b|eurospin|\baldi\b|penny|\bpam\b|iper\b|bennet|tigros|il gigante|\bu2\b|unes|naturasi|carrefour market|simply|in.?s mercato|md discount|famila|despar|eataly)', l2: Supermercato}
