# Natura della spesa: un valore per ogni spesa, preso dalla sottocategoria e modificabile sul singolo movimento.
# I valori qui sotto sono quelli di partenza; si cambiano in Regole e tassonomia > Natura della spesa.
# Una sottocategoria non elencata resta "non definita" finche' non la imposti.
versione: 1
valori:
  necessaria: "Necessaria"
  svago: "Svago"
  superflua: "Superflua"
predefiniti:
  necessaria:
